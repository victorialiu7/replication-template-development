#  Template python-build

#  This template allows you to validate your python code.
#  The workflow allows running tests and code linting on the default branch.
definitions:
  steps:
    - step: &z-run-any-anchor
        name: Run R or Stata code
        # commented out to speed up processing. Uncomment for debugging
        #artifacts:
        # - 1**/**
        script:
          - . ./tools/parse_yaml.sh
          - eval $(parse_yaml config.yml)
          - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          - if [ -f tools/download_openicpsr-private.py ]; then python3 tools/download_openicpsr-private.py $openICPSRID; fi
          - chmod a+rx ./automations/*.sh
          - chmod a+rx ./*.sh
          - ./automations/00_unpack_zip.sh  $openICPSRID
          - ./automations/01_check_file_sizes.sh $openICPSRID
          - ./tools/linux-system-info.sh
          - ./tools/update_config.sh
          - ./run.sh
          - project="${openICPSRID:-$openicpsr}"
          - project="${project:-$dataverse}"
          - project="${project:-$zenodo}"
          - project="${project:-$osf}"
          - ./automations/20_commit_code.sh $project run
          - ./automations/20_commit_code.sh config.yml
          - git status
          - git push
    - step: &check-for-status
        name: Wait for container to terminate
        image: mcr.microsoft.com/azure-cli
        script:
          - az login --service-principal --username $TRACE_spnClientId --password $TRACE_spnSecret --tenant $TRACE_tenantId
          - |
            sleep_counter=10
            start_time=$(date +%s)  
            sleep_max=1200 
            STATUS="Initiate"

            until [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Canceled" ]; do
              current_time=$(date +%s)   
              
              if [ "$cumulative_time" -gt "$sleep_max" ]; then
                echo "Timeout reached after $cumulative_time seconds. Exiting."
                exit 0
              fi     

              
              echo "Sleeping for $sleep_counter seconds."
              sleep $sleep_counter
              
              sleep_counter=$((sleep_counter * 2)) 

              STATUS=$(az container show --resource-group $TRACE_resourceGroup --name $TRACE_azContainerName --query "instanceView.state" -o tsv)
              cumulative_time=$((current_time - start_time)) 
              echo "Container status: $STATUS"
              echo "Cumulative time: $cumulative_time seconds"
            done

    - step: &retrieve-logs-artifacts
        name: Retrieve container logs
        image: mcr.microsoft.com/azure-cli
        script:
          - az login --service-principal --username $TRACE_spnClientId --password $TRACE_spnSecret --tenant $TRACE_tenantId
          - mkdir -p ./logs
          - az container logs --resource-group $TRACE_resourceGroup --name $TRACE_azContainerName > ./logs/azure_logs.txt
        artifacts:
          - logs/azure_logs.txt

pipelines:
  custom:
    1-populate-from-icpsr: #name of this pipeline
      - variables:          #list variable names under here
          # These do not need to have a value, if "config.yml" is filled out.
          - name: openICPSRID   
          - name: jiraticket
          #- name: ZenodoID
          #- name: DataverseID
          #- name: OSFID
          - name: ProcessStata
            default: "yes"
            allowed-values:
              - "no"
              - "yes"
          - name: ProcessR
            default: "yes"
            allowed-values:
              - "no"
              - "yes"
          - name: ProcessPython
            default: "yes"
            allowed-values:
              - "no"
              - "yes"
          - name: ProcessJulia
            default: "no"
            allowed-values:
              - "no"
              - "yes"
          - name: ProcessPii
            default: "yes"
            allowed-values:
              - "no"
              - "yes"
          - name: SkipProcessing
            default: "no"
            allowed-values:
              - "no"
              - "yes"
      - step:
          name: Download
          image: python:3.8
          artifacts:
            - generated/**
            - cache/**
          caches:
            - pip
          script:
            - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            - . ./tools/parse_yaml.sh
            - eval $(parse_yaml config.yml)
            - if [ -d $openICPSRID ]; then \rm -rf $openICPSRID; fi
            - if [ -f tools/download_openicpsr-private.py ]; then python3 tools/download_openicpsr-private.py $openICPSRID; fi
            - mkdir cache
            - mv *.zip cache/
            - chmod a+rx ./automations/*.sh
            - ./automations/00_prepare_aux.sh
            - ./automations/02_list_data_files.sh $openICPSRID
            - ./automations/03_list_program_files.sh $openICPSRID
            - ./automations/04_create_manifest.sh $openICPSRID
            - ./automations/06_check_duplicates_and_zero_bytes.sh $openICPSRID
            - ls -lR
      - parallel: # we will run these in parallel
        - step:
            name: Run Stata parser 
            image:
              name: larsvilhuber/bitbucket-stata:latest
              username: $W_DOCKER_USERNAME
              password: $W_DOCKER_PAT
            script:
              - . ./tools/parse_yaml.sh
              - eval $(parse_yaml config.yml)
              - chmod a+rx ./automations/*.sh
              - ./automations/00_preliminaries.sh $ProcessStata $openICPSRID
              - ./automations/10_run_stata_scanner.sh $openICPSRID
            artifacts:
              - generated/**
        - step:
            name: Run Stata PII scanner
            image:
              name: larsvilhuber/bitbucket-stata:latest
              username: $W_DOCKER_USERNAME
              password: $W_DOCKER_PAT
            script:
              - . ./tools/parse_yaml.sh
              - eval $(parse_yaml config.yml)
              - chmod a+rx ./automations/*.sh
              - ./automations/00_preliminaries.sh $ProcessPii $openICPSRID
              - ./automations/16_run_pii_scanner.sh $openICPSRID
            artifacts:
              - generated/**
        - step:
            name: Run R parser
            image: aeadataeditor/verification-r:latest
            script:
              - . ./tools/parse_yaml.sh
              - eval $(parse_yaml config.yml)
              - chmod a+rx ./automations/*.sh
              - ./automations/00_preliminaries.sh $ProcessR $openICPSRID
              - ./automations/14_run_r_scanner.sh $openICPSRID
        - step:
            name: Run Python parser
            image: python:3.8
            script:
              - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
              - . ./tools/parse_yaml.sh
              - eval $(parse_yaml config.yml)
              - chmod a+rx ./automations/*.sh
              - ./automations/00_preliminaries.sh $ProcessPython $openICPSRID
              - ./automations/15_run_python_scanner.sh $openICPSRID
            artifacts:
              - generated/**
        - step:
            name: Run Julia parser
            image: julia:latest
            script:
              - . ./tools/parse_yaml.sh
              - eval $(parse_yaml config.yml)
              - chmod a+rx ./automations/*.sh
              - ./automations/00_preliminaries.sh $ProcessJulia $openICPSRID
              - ./automations/17_run_julia_scanner.sh $openICPSRID
            artifacts:
              - generated/**
        - step:
            name: Count lines and comments
            image:
              name: aldanial/cloc
              username: $W_DOCKER_USERNAME
              password: $W_DOCKER_PAT
            script:
              - . ./tools/parse_yaml.sh
              - eval $(parse_yaml config.yml)
              - chmod a+rx ./automations/*.sh
              - ./automations/00_preliminaries.sh yes $openICPSRID
              - ./automations/05_count_lines.sh $openICPSRID
            artifacts:
              - generated/**
      ## collect all information
      - step:
          image: python:3.8
          name: Add info to REPLICATION.md
          script:
            - . ./tools/parse_yaml.sh
            - eval $(parse_yaml config.yml)
            - chmod a+rx ./automations/*.sh
            - ./automations/24_amend_report.sh
          artifacts:
            - generated/**
      - step: 
          image: python:3.8
          # This will re-extract the downloaded
          name: Commit everything back
          script:
            - . ./tools/parse_yaml.sh
            - eval $(parse_yaml config.yml)
            - openICPSRID=${openICPSRID:-$openicpsr}
            - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            - if [ -d cache ]; then ls -lR cache/*; fi
            - ls -l generated/*
            - if [ -f cache/$openICPSRID.zip ]; then mv cache/$openICPSRID.zip .; fi
            - if [ -d $openICPSRID ]; then \rm -rf $openICPSRID; fi
            - if [ ! -f $openICPSRID.zip ]; then python3 tools/download_openicpsr-private.py $openICPSRID; fi
            - chmod a+rx ./automations/*.sh
            - ./automations/00_unpack_zip.sh  $openICPSRID
            - ./automations/01_check_file_sizes.sh $openICPSRID
            - ./automations/20_commit_code.sh $openICPSRID
            - ./automations/21_cleanup.sh     $openICPSRID
            - ./automations/25_replace_report.sh
            - ./automations/30_cleanup_aux.sh
            - ./tools/update_config.sh
            - ./automations/20_commit_code.sh config.yml notag
            - git status
            - git push 
            - git push --tags 
    2-merge-report: #name of this pipeline
      - variables:          #list variable names under here
          - name: jiraticket
      - step:
          name: Combine Part A and B of the report
          script:
            - chmod a+rx automations/*.sh
            - ./automations/50_merge-parts.sh
            - git push
    3-split-report: #name of this pipeline
      - variables:          #list variable names under here
          - name: jiraticket
      - step:
          name: Split REPLICATION.md into Part A and B of the report
          script:
            - chmod a+rx automations/*.sh
            - ./automations/51_split-parts.sh
            - git push
    4-refresh-tools: #name of this pipeline
      - step:
          name: Refresh the tools in this repository
          script:
            - wget https://raw.githubusercontent.com/AEADataEditor/replication-template/master/tools/update_tools.sh
            - chmod a+rx update_tools.sh
            - ./update_tools.sh
            - git push
    5-rename-directory: #name of this pipeline
      - variables:          #list variable names under here
          - name: oldName
          - name: newName
          - name: jiraticket
      - step:
          name: Rename a deposit directory
          script:
            - . ./tools/parse_yaml.sh
            - eval $(parse_yaml config.yml)
            - git mv $oldName $newName
            - git commit -m "[skip ci] Rename $oldName to $newName"
            - git push
    6-convert-eps-pdf:  # this can be run to convert EPS and PDF files to PNG
      - variables:          #list variable names under here
          # These do not need to have a value, if "config.yml" is filled out.
          - name: openICPSRID   
          - name: jiraticket
          - name: ProcessEPS
            default: "yes"
            allowed-values:
              - "no"
              - "yes"
          - name: ProcessPDF
            default: "no"
            allowed-values:
              - "no"
              - "yes"
          - name: DockerImg 
            default: "dpokidov/imagemagick"
      - step:
          name: Convert EPS and PDF to PNG
          services:
            - docker
          script:
            - . ./tools/parse_yaml.sh
            - eval $(parse_yaml config.yml)
            - chmod a+rx ./automations/*.sh
            - docker run --rm -v $(pwd):/imgs --entrypoint=/bin/bash $DockerImg ./automations/52_convert_eps_pdf.sh -p $openICPSRID -e $ProcessEPS -d $ProcessPDF
            - git add $openICPSRID
            - git commit -m "[skip ci] Converted EPS and PDF to PNG"
            - git push
    w-big-populate-from-azure: #name of this pipeline
      - variables:          #list variable names under here
          # These do not need to have a value, if "config.yml" is filled out.
          - name: openICPSRID   
          - name: jiraticket
      - step:
          name: Download and commit
          size: 2x
          image: python:3.8
          caches:
            - pip
          script:
            - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            - . ./tools/parse_yaml.sh
            - eval $(parse_yaml config.yml)
            - if [ -d $openICPSRID ]; then \rm -rf $openICPSRID; fi
            # - if [ -f tools/download_openicpsr-private.py ]; then python3 tools/download_openicpsr-private.py $openICPSRID; fi
            # Define Azure storage mount path dynamically
            - export TRACE_azureMountPath="/mnt/workspace/$TRACE_fileShare"
            - az login --service-principal --username $TRACE_spnClientId --password $TRACE_spnSecret --tenant $TRACE_tenantId
            # Check if the file share named "workspace" exists
            - |
              if az storage share-rm list \
                --resource-group "$TRACE_resourceGroup" \
                --storage-account "$TRACE_storageAccountName" \
                --query "[?name=='workspace']" \
                --output tsv | grep -q "workspace"; then 
                echo "File share 'workspace' exists." 
              else
                echo "File share 'workspace' does not exist. Creating..."
                az storage share-rm create \
                  --resource-group "$TRACE_resourceGroup" \
                  --storage-account "$TRACE_storageAccountName" \
                  --name "workspace" \
                  --access-tier Hot
                echo "File share 'workspace' created successfully."
              fi


            # Mount Azure File Share to Bitbucket runner at /mnt/workspace
            - sudo apt-get update && sudo apt-get install -y cifs-utils
            - sudo mkdir -p /mnt/workspace
            - sudo mount -t cifs //$TRACE_storageAccountName.file.core.windows.net/workspace /mnt/workspace -o vers=3.0,username=$TRACE_storageAccountName,password=$TRACE_storageAccessKey,dir_mode=0777,file_mode=0777
            - ls -l /mnt/workspace  # Verify that the workspace file share is accessible

            - mkdir -p /mnt/workspace/$TRACE_fileShare
            - ls -l /mnt/workspace  # Verify that subfolder exists

            # Save downloaded files directly to file share
            - if [ -f tools/download_openicpsr-private.py ]; then python3 tools/download_openicpsr-private.py $openICPSRID --output /mnt/workspace/$TRACE_fileShare/ fi


            - chmod a+rx ./automations/*.sh
            - ./automations/00_prepare_aux.sh
            - ./automations/01_check_file_sizes.sh $TRACE_azureMountPath
            - ./automations/02_list_data_files.sh $TRACE_azureMountPath
            - ./automations/03_list_program_files.sh $TRACE_azureMountPath
            - ./automations/04_create_manifest.sh $TRACE_azureMountPath
            - ./automations/06_check_duplicates_and_zero_bytes.sh $TRACE_azureMountPath
            - ./automations/24_amend_report.sh
            - ./automations/20_commit_code.sh $TRACE_azureMountPath
            - ./automations/21_cleanup.sh     $TRACE_azureMountPath
            - ./automations/25_replace_report.sh
            - ./automations/30_cleanup_aux.sh
            - ./tools/update_config.sh
            - ./automations/20_commit_code.sh config.yml notag
            - git status
            - git push 
            - git push --tags 
      - step:
          name:  Login to ACR and Pull, Tag, and Push Existing Docker Image
          services:
            - docker
          script:
            # Log in to ACR
            - docker login $TRACE_containerRegistry.azurecr.io --username $TRACE_spnClientId --password $TRACE_spnSecret

            # Build the docker image using Linux platform, name the image
            - docker build --platform linux/amd64 -t $TRACE_containerImageName .

            # Tag the image with the remote repo name/path
            - docker tag $TRACE_containerImageName $TRACE_containerImagePath

            # Push the tagged image to the repo
            - docker push $TRACE_containerImagePath
      - step:
          name: Copy Files into File Share
          image: victorialiu/azure-cli-with-azcopy
          script:      
            - az login --service-principal --username $TRACE_spnClientId --password $TRACE_spnSecret --tenant $TRACE_tenantId
            # Copy files into file share 
            - azcopy copy "$TRACE_fileShare/*" "https://$TRACE_storageAccountName.file.core.windows.net/workspace/$TRACE_fileShare?$TRACE_sasToken" --recursive
      
      - step:
          name: Deploy Azure Container Instance
          image: victorialiu/azure-cli-with-azcopy
          script:
            - az login --service-principal --username $TRACE_spnClientId --password $TRACE_spnSecret --tenant $TRACE_tenantId
            - az container create 
                --resource-group "$TRACE_resourceGroup" 
                --name "$TRACE_azContainerName" 
                --image "$TRACE_containerImagePath" 
                --environment-variables SLEEP_PERIOD=5 SLEEP_LOOP=15 STORAGE_FILESHARE_PATH=/home/rstudio/workspace/$TRACE_fileShare 
                --restart-policy Never 
                --cpu 2 
                --memory 2 
                --registry-login-server "$TRACE_containerRegistry.azurecr.io" 
                --registry-username "$TRACE_spnClientId" 
                --registry-password "$TRACE_spnSecret" 
                --vnet "$TRACE_vnet" 
                --subnet "$TRACE_subnet" 
                --azure-file-volume-share-name workspace 
                --azure-file-volume-account-name "$TRACE_storageAccountName" 
                --azure-file-volume-account-key "$TRACE_storageAccessKey" 
                --azure-file-volume-mount-path /home/rstudio/workspace 
                --subscription "$TRACE_subscriptionId"
      - step: *check-for-status
      - step: *retrieve-logs-artifacts
              
      

    x-run-python: 
      - variables: 
          - name: Script
            default: "run-python.sh"
          - step: 
            name: Run Python code
            image: python:3.11
            script:
              - if [ -f "$Script" ]; then chmod a+rx $Script; ./$Script; fi
              - if [ -f "post-run.sh" ]; then chmod a+rx post-run.sh; ./post-run.sh; fi
              - git push
    z-run-stata:  # name of this pipeline
      - variables:          #list variable names under here
          # These do not need to have a value, if "config.yml" is filled out.
          - name: openICPSRID   
          #- name: ZenodoID
          #- name: DataverseID
          #- name: OSFID
          - name: MainFile
            default: "main.do"
          - name: RunCommand
            default: "run.sh"
      - step: 
            <<: *z-run-any-anchor
            name: Run Stata code
            size: 2x
            image:
              name: larsvilhuber/bitbucket-stata:latest
              username: $W_DOCKER_USERNAME
              password: $W_DOCKER_PAT

    z-run-any-big: # name of this pipeline
      - variables:          #list variable names under here
          # These do not need to have a value, if "config.yml" is filled out.
          - name: openICPSRID   
          #- name: ZenodoID
          #- name: DataverseID
          #- name: OSFID
          - name: MainFile
            default: "main.do"
          - name: RunCommand
            default: "run.sh"
      - step:
            name: Run R or Stata code
            size: 8x
            image:
              name: larsvilhuber/bitbucket-stata:latest
              username: $W_DOCKER_USERNAME
              password: $W_DOCKER_PAT
            # commented out to speed up processing. Uncomment for debugging
            #artifacts:
            # - 1**/**
            script:
              - . ./tools/parse_yaml.sh
              - eval $(parse_yaml config.yml)
              - if [ -f tools/download_openicpsr-private.py ]; then python3 tools/download_openicpsr-private.py $openICPSRID; fi
              - chmod a+rx ./automations/*.sh
              - chmod a+rx ./*.sh
              - ./automations/00_unpack_zip.sh  $openICPSRID
              - ./tools/linux-system-info.sh
              - ./tools/update_config.sh
              - ./run.sh
              - ./automations/20_commit_code.sh $openICPSRID run
              - ./automations/20_commit_code.sh config.yml
              - git status
              - git push

